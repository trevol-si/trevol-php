# CI del SDK de PHP (docs/api/43 §2.13). Escrita, NO activa: se activa sola cuando este directorio sea su propio repo (trevol-php).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    env:
      TREVOL_API_KEY: tvl_test_a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          tools: composer
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Sintaxis de lo propio
        run: find src pruebas -name '*.php' -not -path '*/programas/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: vendor/bin/phpunit --testsuite unitarias
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contra Prism (servidor simulado desde la especificación pública) y los fragmentos de la documentación
        run: |
          npx --yes @stoplight/prism-cli@5.16.0 mock pruebas/datos/openapi.json -p 4010 -h 127.0.0.1 > /tmp/prism.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:4010/health && break; sleep 1; done
          TREVOL_PRISM_URL=http://127.0.0.1:4010 vendor/bin/phpunit --testsuite prism,fragmentos
